<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋填 · 本地网申测试</title><link rel="stylesheet" href="/extension/styles.css"><style>main{max-width:960px;margin:50px auto;padding:0 28px 80px}fieldset{border:1px solid #dce4da;border-radius:12px;padding:26px;background:white;margin:24px 0}legend{font-size:18px;font-weight:600}form{max-width:540px}label{margin:16px 0}.pair{display:flex;gap:15px}.pair>*{flex:1}.toolbar{padding:20px;background:#eaf0e4;border-radius:12px;margin:20px 0}#test-results{white-space:pre-wrap;font:13px/1.8 monospace}header p{max-width:540px}</style><body><main><header><div class="eyebrow">LOCAL SANDBOX · NO SUBMISSION</div><h1>先在这里试填一次。</h1><p>本页使用虚构简历，模拟网申的文本、日期、下拉框和多段经历。右侧运行与插件相同的填写代码。</p></header><div class="toolbar"><button id="verifyfill" type="button">核验一键填写结果</button> <button id="selftest" class="primary">运行控件验证</button> <button id="reset" type="button">重置测试页面</button><div id="test-results" role="status"></div></div><form id="test-form"><fieldset data-section="personal"><legend>个人信息</legend><label>姓名<input id="name"></label><label>手机号码<input id="phone" type="tel"></label><label>电子邮箱<input id="email" type="email"></label><label>性别<select id="gender"><option value="">请选择</option><option value="m">男</option><option value="f">女</option></select></label><label>出生日期<input id="birthday" type="date"></label><label>国籍<select id="nationality"><option value="">请选择</option><option>中国</option><option>其他</option></select></label><label>联系地址<input id="existing" value="这段已填内容需要保留"></label><label>紧急联系人姓名<input id="unknown"></label><label>登录密码<input type="password" id="password"></label><label>上传简历<input type="file" id="file"></label><label><input type="checkbox" id="agreement" style="width:auto"> 同意条款（应保持未勾选）</label></fieldset><fieldset data-section="education"><legend>教育经历</legend><label>学校名称<input id="school"></label><label>专业名称<input id="major"></label><label>学历<select id="degree"><option value="">请选择</option><option>本科</option><option>硕士</option></select></label><div class="pair"><label>开始时间<input id="edu-start" type="month"></label><label>结束时间<input id="edu-end" type="month"></label></div></fieldset><fieldset data-section="project"><legend>项目经历</legend><div class="project"><h3>项目 1</h3><label>项目名称<input id="project1"></label><label>项目角色<input id="role1"></label><div class="pair"><label>开始时间<input id="start1" type="month"></label><label>结束时间<input id="end1" type="month"></label></div><label>项目链接<input id="url1" type="url"></label><label>描述<textarea id="desc1"></textarea></label></div><div class="project"><h3>项目 2</h3><label>项目名称<input id="project2"></label><label>项目角色<input id="role2"></label><div class="pair"><label>开始时间<input id="start2" type="month"></label><label>结束时间<input id="end2" type="month"></label></div><label>项目链接<input id="url2" type="url"></label><label>描述<textarea id="desc2"></textarea></label></div><button id="add" type="button">+ 添加项目（验证继续填写）</button></fieldset><button type="submit" id="submit">模拟提交（只在本页计数）</button><span id="submit-count">提交次数：0</span></form></main><script src="/tests/demo-bridge.js"></script><script src="/extension/schema.js"></script><script src="/extension/engine.js"></script><script src="/extension/beisen.js"></script><script src="/extension/content.js"></script><script src="/tests/demo-tests.js"></script></body></html>
